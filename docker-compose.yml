services:
  caldiy-server:
    build:
      context: ./caldiy-server
      dockerfile: Dockerfile
    container_name: caldiy-server
    restart: always
    ports:
      - "5555:5555"
      - "3000:3000"
    environment:
      - PORT=5555
      - WEB_PORT=3000
      - CAL_API_KEY=${CAL_API_KEY}
      - TIMEZONE=Asia/Kolkata
      - OWNER_NAME=Balpreet
      - OWNER_EMAIL=balpreet@example.com

